name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # daily: the skills change in their own repository, without a push here

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the skills, to test what they name against this CLI
        uses: actions/checkout@v4
        with:
          repository: Anttarress/rango-skills
          path: rango-skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          RANGO_SKILLS_DIR: ${{ github.workspace }}/rango-skills/skills
      - run: pnpm build
      - name: Smoke-test the built binary
        run: node dist/rango.js --help && node dist/rango.js --version
